# Weekly dependency updates. npm (src/sky-renderer) is added in M2, when the renderer exists.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ["xunit*", "FluentAssertions", "Microsoft.NET.Test.Sdk", "coverlet.*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
