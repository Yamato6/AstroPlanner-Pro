# Weekly dependency updates.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ["xunit*", "FluentAssertions", "Microsoft.NET.Test.Sdk", "coverlet.*"]

  - package-ecosystem: npm
    directory: "/src/sky-renderer"
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
