# Weekly dependency updates.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ["xunit*", "FluentAssertions", "Microsoft.NET.Test.Sdk", "coverlet.*"]
    ignore:
      # PDFsharp 6.5.0 and later are AGPL-3.0-only; the app is MIT (spec §12). Stay on 6.2.x.
      - dependency-name: "PDFsharp"
        versions: [">= 6.3.0"]

  - package-ecosystem: npm
    directory: "/src/web"
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; TypeScript 7 waits until it does.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
