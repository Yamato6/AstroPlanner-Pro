name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # Web workspace (sky engine + pages, spec §12): lint, type-check + build, tests (contract
      # and projection cross-check share tests/fixtures/bridge with the C# suite). The UI build
      # embeds apps/planetarium/dist.
      - name: Web workspace
        working-directory: src/web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          npm test

      - name: Build (warnings are errors)
        run: dotnet build AstroPlanner.slnx -c Release -warnaserror

      # The committed catalogs.sqlite must pass the sanity checks (no download: sources are
      # only fetched by developers, see docs/data-pipeline.md).
      - name: Verify the catalog database and the sky data
        run: dotnet run --project tools/AstroPlanner.DataBuilder -c Release --no-build -- verify

      # Timing budgets (spec §14) are measured without coverage instrumentation, which
      # slows tight numeric loops several times.
      - name: Performance tests
        run: dotnet test AstroPlanner.slnx -c Release --no-build --filter "Category=Performance"

      - name: Test with coverage
        run: >
          dotnet test AstroPlanner.slnx -c Release --no-build --filter "Category!=Performance"
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage report
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.0
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" `
            "-reporttypes:MarkdownSummaryGithub;Cobertura;Badges" "-assemblyfilters:+AstroPlanner*"
          Get-Content coverage-report/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      # Line coverage gates: Core >= 85 % (spec §11), Application >= 80 % (v3 R0c).
      - name: Coverage gates (Core >= 85 %, Application >= 80 %)
        shell: pwsh
        run: |
          [xml]$report = Get-Content coverage-report/Cobertura.xml
          $failed = $false
          foreach ($gate in @(@{ Name = 'AstroPlanner.Core'; Minimum = 85 }, @{ Name = 'AstroPlanner.Application'; Minimum = 80 })) {
            $package = $report.coverage.packages.package | Where-Object { $_.name -eq $gate.Name }
            $rate = [math]::Round([double]$package.'line-rate' * 100, 1)
            "$($gate.Name) line coverage: $rate %" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
            if ($rate -lt $gate.Minimum) { Write-Error "$($gate.Name) line coverage $rate % is below $($gate.Minimum) %"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage-report/

  release:
    # Only when a version tag is pushed, e.g. v2.0.0 or v2.0.0-rc.1
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      # The tag's version ends up in the .exe (About window, update notice).
      # Compressed: ~76 MB instead of ~175 MB, at the cost of ~0.2 s more at startup.
      - name: Publish self-contained .exe
        run: >
          dotnet publish src/AstroPlanner.UI -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.version.outputs.value }} -p:RequireSkyRenderer=true
          -o publish

      # Code signing (docs/signing.md): only once the SignPath Foundation project is set up, i.e.
      # when the repository variable SIGNPATH_ORGANIZATION_ID exists. Otherwise the release is
      # unsigned and these steps are skipped.
      - name: Upload the unsigned .exe for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: publish/AstroPlannerPro.exe

      - name: Sign the .exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item publish\AstroPlannerPro.exe portable\
          Copy-Item LICENSE portable\LICENSE.txt
          Copy-Item README.md portable\
          Copy-Item THIRD_PARTY_NOTICES.md portable\
          $zip = "dist\AstroPlannerPro_${{ steps.version.outputs.value }}_win-x64_portable.zip"
          Compress-Archive -Path portable\* -DestinationPath $zip
          # The zip must have the app and its licenses (spec §12).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try { $entries = $archive.Entries.FullName } finally { $archive.Dispose() }
          foreach ($required in 'AstroPlannerPro.exe', 'LICENSE.txt', 'README.md', 'THIRD_PARTY_NOTICES.md') {
            if ($entries -notcontains $required) { throw "The portable zip lacks $required." }
          }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Inno Setup 6 or 7, wherever Chocolatey put it.
          $iscc = Get-ChildItem "${env:ProgramFiles}\Inno Setup *\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc.FullName `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "/DPublishDir=$PWD\publish" `
            "/DOutputDir=$PWD\dist" `
            installer\AstroPlanner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the unsigned installer for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/AstroPlannerPro_${{ steps.version.outputs.value }}_Setup.exe

      - name: Sign the installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: tools/release-notes.ps1 -Version "${{ steps.version.outputs.value }}" -OutFile notes/release-notes.md

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: AstroPlanner Pro ${{ steps.version.outputs.value }}
          body_path: notes/release-notes.md
