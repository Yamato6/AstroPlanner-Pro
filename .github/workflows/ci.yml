name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build AstroPlanner.slnx -c Release -warnaserror

      - name: Test with coverage
        run: >
          dotnet test AstroPlanner.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage report
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.0
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" `
            "-reporttypes:MarkdownSummaryGithub;Cobertura;Badges" "-assemblyfilters:+AstroPlanner*"
          Get-Content coverage-report/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      # Spec §11: at least 85 % line coverage for Core.
      - name: Core coverage gate (>= 85 %)
        shell: pwsh
        run: |
          [xml]$report = Get-Content coverage-report/Cobertura.xml
          $core = $report.coverage.packages.package | Where-Object { $_.name -eq 'AstroPlanner.Core' }
          $rate = [math]::Round([double]$core.'line-rate' * 100, 1)
          "Core line coverage: $rate %" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($rate -lt 85) { Write-Error "Core line coverage $rate % is below 85 %"; exit 1 }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage-report/

  release:
    # Only when a version tag is pushed, e.g. v2.0.0 or v2.0.0-rc.1
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      # The tag's version ends up in the .exe (About window, update notice).
      # Compressed: ~76 MB instead of ~175 MB, at the cost of ~0.2 s more at startup.
      - name: Publish self-contained .exe
        run: >
          dotnet publish src/AstroPlanner.UI -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item publish\AstroPlannerPro.exe portable\
          Copy-Item LICENSE portable\LICENSE.txt
          Copy-Item README.md portable\
          Compress-Archive -Path portable\* -DestinationPath "dist\AstroPlannerPro_${{ steps.version.outputs.value }}_win-x64_portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "/DPublishDir=$PWD\publish" `
            "/DOutputDir=$PWD\dist" `
            installer\AstroPlanner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
